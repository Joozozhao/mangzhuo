<script type="application/javascript">
	$(function(){
		showMembers();
		function showMembers(){
			$.ajax({
				type:'POST',
				url:'/vote/gift/showrank',
				data:{},
				dataType:'json',
				success:function(json){
					dealAjax(json);
				}
			});
		}
		function dealAjax(json){
			if(json.code == 0) {
				var data = json.data;
				for (var i=0;i<data.length;i++){
					$("#h"+i).html(data[i]['programName']);
					$("#score"+i).html(data[i]['score']);
				}
			}
		}
		setInterval(function (){
			$.ajax({
				type:'POST',
				url:'/vote/gift/showrank',
				data:{},
				dataType:'json',
				success:function(json){
					dealAjax(json);
				}
			});
		},3000);
	});
</script>

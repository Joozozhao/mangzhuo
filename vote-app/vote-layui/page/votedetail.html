<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>品酒</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/lib/layui-v2.10.3/css/layui.css" rel="stylesheet">
</head>
<body>
<div style="padding: 16px;">
    <blockquote class="layui-elem-quote" style="font-size: 20px;margin-bottom: 20px;">评分详情</blockquote>
    <table class="layui-hide" id="test" lay-filter="test"></table>
</div>
<script type="text/html" id="toolbarDemo">
    <div class="layui-btn-container">
        <a href="/page/tasteindex.html" class="layui-btn layui-btn-sm">返回</a>
    </div>
</script>
<script src="/lib/layui-v2.10.3/layui.js"></script>
<script>
    function getParameterByName(name) {
        name = name.replace(/[\[]/, "\\[").replace(/[\]]/, "\\]");
        var regex = new RegExp("[\\?&]" + name + "=([^&#]*)"),
            results = regex.exec(location.search);
        return results === null ? "" : decodeURIComponent(results[1].replace(/\+/g, " "));
    }
    layui.use(['table','jquery'], function(){
        var table = layui.table
            ,$ = layui.$;
        // 创建渲染实例
        var id = getParameterByName("id");
        if(id == "" || id==null || id==undefined){
            window.location.href="/page/tasteindex.html";
        }
        $.ajax({
            type:'POST',
            url:'/taste/wechat/getcolumns',
            data:{
                tasteId:id
            },
            dataType:'json',
            success:function(json){
                if(json.code == 0){
                    initTable(json.data);
                }else{
                    layer.msg('保存失败！', {time: 500, icon: -1}, function() {
                        if(status ==0){
                            $("#status"+id).removeProp("checked");
                        }else{
                            $("#status"+id).prop("checked",true);
                        }
                    });
                }
            }
        });
        function initTable(columns){
            table.render({
                elem: '#test',
                url: '/taste/wechat/getvotedetail?tasteId='+id, // 此处为静态模拟数据，实际使用时需换成真实接口
                toolbar: '#toolbarDemo',
                defaultToolbar: false,
                page: false,
                cols: [columns],
                xhrFields: { // 设置 xhrFields，用以设置 withCredentials 属性
                    withCredentials: true // 开启跨域请求时携带凭证信息（如 cookies）
                },
                error: function(res, msg){
                    // console.log(res, msg)
                }
            });
        }
    });
</script>
</body>
</html>

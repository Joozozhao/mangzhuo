<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>品酒</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link href="/lib/layui-v2.10.3/css/layui.css" rel="stylesheet">
</head>
<body>
<blockquote class="layui-elem-quote" style="font-size: 20px;margin-bottom: 20px;"><span id="tasteName"></span>-评分</blockquote>
<form class="layui-form layui-form-pane" style="padding-right: 10px;padding-left: 10px;">
    <div id="vote-div"></div>
    <div class="layui-form-item">
        <div class="layui-input-block">
<!--            <a href="javascript:void(0)" class="layui-btn" id="btnSubmit">立即提交</a>-->
            <button class="layui-btn" lay-submit lay-filter="btnSubmit">立即提交</button>
            <a href="/page/tasteindex.html" class="layui-btn layui-btn-primary">返回</a>
        </div>
    </div>
</form>
<script src="/lib/jquery/jquery.min.js"></script>
<script src="/lib/layui-v2.10.3/layui.js"></script>
<script>
    function getParameterByName(name) {
        name = name.replace(/[\[]/, "\\[").replace(/[\]]/, "\\]");
        var regex = new RegExp("[\\?&]" + name + "=([^&#]*)"),
            results = regex.exec(location.search);
        return results === null ? "" : decodeURIComponent(results[1].replace(/\+/g, " "));
    }
    layui.use('form', function(){
        var form = layui.form;
        var id = getParameterByName("id");
        if(id == "" || id==null || id==undefined){
            window.location.href="/page/tasteindex.html";
        }
        $.ajax({
            type:'POST',
            url:'/taste/wechat/gettaste',
            data:{
                id:id
            },
            xhrFields: { // 设置 xhrFields，用以设置 withCredentials 属性
                withCredentials: true // 开启跨域请求时携带凭证信息（如 cookies）
            },
            dataType:'json',
            success:function(json){
                if(json.code == 0){
                    var data = json.data;
                    $("#tasteName").html(data.tasteName);
                    var str = "";
                    for (var i=0;i<data.listVoteTasteType.length;i++){
                        var getVoteTasteType = data.listVoteTasteType;
                        var html1="<div class=\"layui-form-item layui-form-text\">\n" +
                            "        <label class=\"layui-form-label\">酒名</label>\n" +
                            "        <div class=\"layui-input-block\">\n" +
                            "            <input type=\"text\" data=\""+getVoteTasteType[i].tasteType+"\" name=\"type_name"+i+"\" lay-verify=\"required\" autocomplete=\"off\" placeholder=\"请输入酒名\" class=\"layui-input\">\n" +
                            "        </div>\n" +
                            "    </div>"
                        var html="<div class=\"layui-form-item layui-form-text\">\n" +
                            "        <label class=\"layui-form-label\">分类"+(i+1)+"</label>\n" +
                            "        <div class=\"layui-input-block\">\n" +
                            "            <input type=\"text\" data=\""+getVoteTasteType[i].id+"\" name=\"taste_name"+i+"\" lay-verify=\"required|number\" autocomplete=\"off\" placeholder=\"请输入分数\" class=\"layui-input\">\n" +
                            "        </div>\n" +
                            "    </div>"
                        str = str+html1+html;
                    }
                    $("#vote-div").empty().html(str);
                }else{
                    window.location.href="/page/tasteindex.html";
                }

            }
        });
        //监听提交
        form.on('submit(btnSubmit)', function(data){
            var fieldObject = data.field;
            var error = 0;
            var keyStr = "";
            var scoreStr = "";
            var typeName = "";
            var judgeResult = "";
            for(var key in fieldObject){
                var data = $("input[name='"+key+"']").attr("data");
                var value = $("input[name='"+key+"']").val();
                if(key.indexOf("taste_name")!=-1){
                    if(keyStr == ""){
                        keyStr = data;
                        scoreStr = value;
                        if(value>100){
                            error = 1;
                        }
                    }else{
                        keyStr = keyStr+","+data;
                        scoreStr = scoreStr+","+value;
                    }
                }else{
                    if(typeName == ""){
                        typeName = value;
                        judgeResult = data;
                    }else{
                        typeName = typeName+","+value;
                        judgeResult = judgeResult+","+data;
                    }
                }
            }
            if(error == 1){
                layer.msg("评分不能超过100分！", {icon: -1});
                return false;
            }
            $.ajax({
                type:'POST',
                url:'/taste/wechat/savescore',
                data:{
                    keyStr:keyStr,
                    scoreStr:scoreStr,
                    tasteId:id,
                    typeName:typeName,
                    judgeResult:judgeResult
                },
                xhrFields: { // 设置 xhrFields，用以设置 withCredentials 属性
                    withCredentials: true // 开启跨域请求时携带凭证信息（如 cookies）
                },
                dataType:'json',
                success:function(json){
                    if(json.code == 0){
                        //成功
                        layer.msg('评分成功！', {time: 500, icon: 1}, function() {
                            window.location.href="/page/tasteindex.html";
                        });
                    }else{
                        layer.msg(json.msg, {icon: -1});
                    }
                }
            });
            return false;
        });
    });
</script>

</body>
</html>

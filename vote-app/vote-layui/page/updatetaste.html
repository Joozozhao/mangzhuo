<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>品酒</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link href="/lib/layui-v2.10.3/css/layui.css" rel="stylesheet">
</head>
<body>
<blockquote class="layui-elem-quote" style="font-size: 20px;margin-bottom: 20px;">编辑品鉴单</blockquote>
<form class="layui-form layui-form-pane" style="padding-right: 10px;padding-left: 10px;">
    <div class="layui-form-item">
        <label class="layui-form-label">名称</label>
        <div class="layui-input-block">
            <input type="text" id="taste_name" name="taste_name" lay-verify="title" autocomplete="off" placeholder="请输入名称" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-row div-data div-upload" data = "1">
        <div class="layui-col-xs9">
            <div class="grid-demo grid-demo-bg1">
                <label class="layui-form-label">酒名1</label>
                <div class="layui-input-block">
                    <input type="text" id="tasteType" name="tasteType" lay-verify="required" lay-reqtext="酒名是必填项，岂能为空？" placeholder="请输入酒名" autocomplete="off" class="layui-input tasteType">
                </div>
            </div>
        </div>
        <div class="layui-col-xs3" style="text-align: right">
            <div class="grid-demo">
                <button type="button" class="layui-btn layui-btn-primary layui-btn-sm addBtn" style="height: 38px;line-height: 30px;padding: 0 8px;font-size: 12px;">
                    <i class="layui-icon">&#xe654;</i>
                </button>
                <button type="button" class="layui-btn layui-btn-primary layui-btn-sm removeBtn" style="height: 38px;line-height: 30px;padding: 0 8px;font-size: 12px;margin-left: 5px;">
                    <i class="layui-icon">&#x1006;</i>
                </button>
            </div>
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-block">
            <a href="javascript:void(0)" class="layui-btn" id="btnSubmit">立即提交</a>
            <a href="/page/tasteindex.html" class="layui-btn layui-btn-primary">返回</a>
        </div>
    </div>
</form>
<script src="/lib/jquery/jquery.min.js"></script>
<script src="/lib/layui-v2.10.3/layui.js"></script>
<script>
    function getParameterByName(name) {
        name = name.replace(/[\[]/, "\\[").replace(/[\]]/, "\\]");
        var regex = new RegExp("[\\?&]" + name + "=([^&#]*)"),
            results = regex.exec(location.search);
        return results === null ? "" : decodeURIComponent(results[1].replace(/\+/g, " "));
    }
    $(document).ready(function(){
        var id = getParameterByName("id");
        if(id == "" || id==null || id==undefined){
            window.location.href="/page/tasteindex.html";
        }
        $.ajax({
            type:'POST',
            url:'/taste/wechat/gettaste',
            data:{
                id:id
            },
            xhrFields: { // 设置 xhrFields，用以设置 withCredentials 属性
                withCredentials: true // 开启跨域请求时携带凭证信息（如 cookies）
            },
            dataType:'json',
            success:function(json){
                if(json.code == 0){
                    var data = json.data;
                    $("#taste_name").val(data.tasteName);
                    for (var i=0;i<data.listVoteTasteType.length;i++){
                        var getVoteTasteType = data.listVoteTasteType;
                        if(i==0){
                            $(".addBtn").closest('.div-data').attr("data",getVoteTasteType[i].id);
                            $("#tasteType").val(getVoteTasteType[i].tasteType);
                        }else{
                            var index = getVoteTasteType[i].id;
                            var html = "<div class=\"layui-form-item layui-row div-data\" data = \""+index+"\">\n" +
                                "        <div class=\"layui-col-xs9\">\n" +
                                "            <div class=\"grid-demo grid-demo-bg1\">\n" +
                                "                <label class=\"layui-form-label\">酒名"+(i+2)+"</label>\n" +
                                "                <div class=\"layui-input-block\">\n" +
                                "                    <input type=\"text\" value=\""+getVoteTasteType[i].tasteType+"\" name=\"tasteType\" lay-verify=\"required\" lay-reqtext=\"酒名是必填项，岂能为空？\" placeholder=\"请输入酒名\" autocomplete=\"off\" class=\"layui-input tasteType\">\n" +
                                "                </div>\n" +
                                "            </div>\n" +
                                "        </div>\n" +
                                "        <div class=\"layui-col-xs3\" style=\"text-align: right\">\n" +
                                "            <div class=\"grid-demo\">\n" +
                                "                <button type=\"button\" class=\"layui-btn layui-btn-primary layui-btn-sm addBtn\" style=\"height: 38px;line-height: 30px;padding: 0 8px;font-size: 12px;\">\n" +
                                "                    <i class=\"layui-icon\">&#xe654;</i>\n" +
                                "                </button>\n" +
                                "                <button type=\"button\" class=\"layui-btn layui-btn-primary layui-btn-sm removeBtn\" style=\"height: 38px;line-height: 30px;padding: 0 8px;font-size: 12px;margin-left: 5px;\">\n" +
                                "                    <i class=\"layui-icon\">&#x1006;</i>\n" +
                                "                </button>\n" +
                                "            </div>\n" +
                                "        </div>\n" +
                                "    </div>";
                            $(".div-upload").after(html);
                        }
                    }

                }else{
                    window.location.href="/page/tasteindex.html";
                }

            }
        });


        $(document).on("click",'.addBtn',function (){
            var index = parseInt($(this).closest('.div-data').attr('data'));
            var html = "<div class=\"layui-form-item layui-row div-data\" data = \""+(index+1)+"\">\n" +
                "        <div class=\"layui-col-xs9\">\n" +
                "            <div class=\"grid-demo grid-demo-bg1\">\n" +
                // "                <label class=\"layui-form-label\">分类</label>\n" +
                "                <div class=\"layui-input-block\">\n" +
                "                    <input type=\"text\" name=\"tasteType\" lay-verify=\"required\" lay-reqtext=\"用户名是必填项，岂能为空？\" placeholder=\"请输入分类\" autocomplete=\"off\" class=\"layui-input tasteType\">\n" +
                "                </div>\n" +
                "            </div>\n" +
                "        </div>\n" +
                "        <div class=\"layui-col-xs3\" style=\"text-align: right\">\n" +
                "            <div class=\"grid-demo\">\n" +
                "                <button type=\"button\" class=\"layui-btn layui-btn-primary layui-btn-sm addBtn\" style=\"height: 38px;line-height: 30px;padding: 0 8px;font-size: 12px;\">\n" +
                "                    <i class=\"layui-icon\">&#xe654;</i>\n" +
                "                </button>\n" +
                "                <button type=\"button\" class=\"layui-btn layui-btn-primary layui-btn-sm removeBtn\" style=\"height: 38px;line-height: 30px;padding: 0 8px;font-size: 12px;margin-left: 5px;\">\n" +
                "                    <i class=\"layui-icon\">&#x1006;</i>\n" +
                "                </button>\n" +
                "            </div>\n" +
                "        </div>\n" +
                "    </div>";
            $(this).closest('.div-data').after(html);
        })
        $(document).on("click",'.removeBtn',function (){
            var count = $(".tasteType").length;
            if(count>1){
                $(this).closest('.div-data').remove();
            }else{
                layer.msg("最少设置一个分类！", {icon: -1});
            }
        })
        //提交
        $(document).on("click",'#btnSubmit',function (){
            var tasteName = $("#taste_name").val();
            var tasteTypeArr = [];
            var tasteTypeIdArr = [];
            $(".tasteType").each(function(){
                var tasteType = $(this).val().trim();
                if(tasteType!="" && tasteType!=null && tasteType!=undefined){
                    tasteTypeArr.push(tasteType);
                }
                var data = $(this).closest('.div-data').attr('data');
                if(data!="" && data!=null && data!=undefined){
                    tasteTypeIdArr.push(data);
                }
            });
            var str = "";
            if(tasteTypeArr.length>0){
                str = tasteTypeArr.join(",");
            }
            var strId = "";
            if(tasteTypeArr.length>0){
                strId = tasteTypeIdArr.join(",");
            }
            $.ajax({
                type:'POST',
                url:'/taste/wechat/updatetastetype',
                data:{
                    tasteName:tasteName,
                    tasteType:str,
                    tasteTypeId:strId,
                    id:id
                },
                xhrFields: { // 设置 xhrFields，用以设置 withCredentials 属性
                    withCredentials: true // 开启跨域请求时携带凭证信息（如 cookies）
                },
                dataType:'json',
                success:function(json){
                    if(json.code == 0){
                        //成功
                        layer.msg('保存成功！', {time: 500, icon: 1}, function() {
                            window.location.href="/page/tasteindex.html";
                        });
                    }else{
                        layer.msg(json.msg, {icon: -1});
                    }
                }
            });
        });
    });

</script>

</body>
</html>

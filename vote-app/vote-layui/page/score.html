<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
		<meta name="description" content="2024 向新而生">
		<meta name="author" content="Webpixels">
		<title>个人评分</title>
		<!-- Fonts -->
		<link href="https://fonts.googleapis.com/css?family=Nunito:400,600,700,800|Roboto:400,500,700" rel="stylesheet">
		<!-- Theme CSS -->
		<link rel="stylesheet" href="../lib/layui/css/layui.css" media="all">
		<link type="text/css" href="../css/theme.css" rel="stylesheet">
		<!-- Demo CSS - No need to use these in your project -->
		<link type="text/css" href="../css/demo.css" rel="stylesheet">
		<style type="text/css">
			.mt-1 {
				margin-top: 10px;
			}
		</style>
	</head>
	<body>
		<section class="py-xl bg-cover bg-size--cover"
			style="background-image: url('../images/bg.jpg'); height: 100vh;">
			<span class="mask bg-primary alpha-2"></span>
			<div class="container d-flex align-items-center no-padding">
				<div class="col">
					<div class="row justify-content-center">
						<div class="col-lg-4">
							<div class="card bg-primary text-white">
								<div class="card-body">
									<span class="clearfix"></span>
									<img id="img10" src="../images/header.png" class="avatar avatar-lg mr-3">
									<span id="scoreName"></span>
									<br><br>
									<div class="alert alert-warning alert-dismissible fade show sort-close" role="alert" style="display: none">
									    <span class="alert-inner--icon"><i class="fas fa-exclamation"></i></span>
									    <span class="alert-inner--text"><strong>注意!</strong> 
										<div><span class="show-sort">训练营：7 </span><br></div>
										</span>
									    <button type="button" class="undo" aria-label="Undo"></button>
									    <button type="button" class="close " data-dismiss="alert" aria-label="Close">
									        <span aria-hidden="true">&times;</span>
									    </button>
									</div>
									<div class="alert alert-primary alert-shadow alert-dismissible fade show"
										role="alert">
										<strong><span class="alert-inner--icon text-info"><i
													class="fas fa-info"></i></span>评分关键点!</strong>
										<div class="task-remark">内容深度与原创性、幽默感与节奏感、观点与价值观、表达技巧与舞台表现、观众互动与反馈、整体效果与呈现。</div>
										<button type="button" class="undo" aria-label="Undo"></button>
										<button type="button" class="close" data-dismiss="alert" aria-label="Close">
											<span aria-hidden="true">&times;</span>
										</button>
									</div>
									<br>
									<form class="form-primary">
										<div class="row">
											<div class="col-lg-12">
												<button type="button"
													class="btn btn-block btn-secondary btn-vote" score="0">放弃投票</button>
											</div>
											<!--普通-->
											<div class="col-lg-12  isStaff">
												<div class="mt-1">
													<button type="button"
															class="btn btn-block  btn-secondary btn-vote" score="1"> 1 票</button>
												</div>
												<div class="mt-1">
													<button type="button"
															class="btn btn-block btn-secondary btn-vote" score="2"> 2 票</button>
												</div>
												<div class="mt-1">
													<button type="button"
															class="btn btn-block btn-secondary btn-vote" score="3"> 3 票</button>
												</div>
											</div>
											<!--高管-->
											<div class="col-lg-12 mt-1 isJudges" style="display: none">
												<div class="mt-1">
													<button type="button"
															class="btn btn-block  btn-secondary btn-vote" score="10"> 10 票</button>
												</div>
												<div class="mt-1">
													<button type="button"
															class="btn btn-block btn-secondary btn-vote" score="15"> 15 票</button>
												</div>
												<div class="mt-1">
													<button type="button"
															class="btn btn-block btn-secondary btn-vote" score="20"> 20 票</button>
												</div>
											</div>
										</div>
										<button type="button" class="mt-4 btn btn-block btn-dark btn-animated btn-animated-x submit">
										    <span class="btn-inner--visible">提交</span>
										    <span class="btn-inner--hidden"><i class="fas fa-arrow-right"></i></span>
										</button>
										
									</form>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
		<input type="hidden" class="taskId" value=""/>
		</main>
		</footer>
		<!-- Core -->
		<script src="../lib/jquery/jquery.min.js"></script>
		<script src="../lib/popper/popper.min.js"></script>
		<script src="../js/bootstrap/bootstrap.min.js"></script>
		<!-- FontAwesome 5 -->
		<script src="../lib/fontawesome/js/fontawesome-all.min.js" defer></script>
		<!-- Page plugins -->
		<script src="../lib/bootstrap-select/js/bootstrap-select.min.js"></script>
		<script src="../lib/bootstrap-tagsinput/bootstrap-tagsinput.min.js"></script>
		<script src="../lib/input-mask/input-mask.min.js"></script>
		<script src="../lib/nouislider/js/nouislider.min.js"></script>
		<script src="../lib/textarea-autosize/textarea-autosize.min.js"></script>
		<!-- Theme JS -->
		<script src="../js/theme.js"></script>
		<script src="../lib/layui/layui.js"></script>
	</body>
</html>
<script type="text/javascript">
	layui.use(['layer'], function(){
		let $ = layui.$, layer = layui.layer;
		$(".submit").attr("disabled",true);
		//显示页面内容
		function showScore(){
			$.ajax({
				type:'POST',
				url:'/vote/mobile/showScore',
				data:{},
				dataType:'json',
				success:function(json){
					if(json.code == 0){
						//排序
						var data = json.data;
						if(data.show){
							$(".sort-close").show();
							$(".show-sort").html(data.taskName+" : "+data.sort);
						}else{
							$(".sort-close").hide();
						}
						//描述
						$(".task-remark").html(data.remark);
						$("#scoreName").html("当前评分："+data.performer);
						$("#img10").attr("src",data.img);
						//分数
						if(data.groupId!=9){
							$(".isStaff").show();
							$(".isJudges").hide();
						}else{
							$(".isStaff").hide();
							$(".isJudges").show();
						}
						//任务ID
						$(".taskId").val(data.taskId);
						//是否已投票
						if(data.vote){
							$(".submit").attr("disabled",false);
						}else{
							$(".submit").attr("disabled",true);
						}
					}else if(json.msg == "nologin"){
						//重新登录
						location.href = "/page/auth.html"
					}else{
						$(".submit").attr("disabled",true);
					}
				}
			});
		}
		showScore();
		setInterval(showScore,3000);
		//投票按钮切换
		$(".btn-vote").click(function(){
			var hasClass = $(this).hasClass("active");
			if(hasClass){
				$(this).removeClass("active");
			}else{
				$(".btn-vote").each(function(){
					$(this).removeClass("active");
				})
				$(this).addClass("active");
			}
		});
		$(".submit").on("click",function(){
			$(".submit").attr("disabled",true);
			var taskId = $(".taskId").val();
			var score =  $(".active").attr("score");
			if(score == "" || score == null || score==undefined){
				layer.msg("请选择票数", {icon: 2});
				$(".submit").attr("disabled",false);
			}
			$.ajax({
				type:'POST',
				url:'/vote/mobile/saveVote',
				data:{taskId:taskId,score:score},
				dataType:'json',
				success:function(json){
					if(json.code == 0){
						layer.msg("已成功投票", {icon: 1});
					}else if(json.msg == "nologin"){
						//重新登录
						location.href = "/page/auth.html"
					}else{
						$(".submit").attr("disabled",true);
						layer.msg("投票失败，请重新投票", {icon: 2});
					}
				}
			});
		});
	});
</script>

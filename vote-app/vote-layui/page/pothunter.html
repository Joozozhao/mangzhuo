<!DOCTYPE html>
<html lang="en" >
<head>
    <meta charset="utf-8">

    <title id="title">照片墙</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Nunito:400,600,700,800|Roboto:400,500,700" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main>
	<div id="gallery">
	</div>
</main>
<!-- partial -->
<script  src="../js/script.js"></script>
<script src="../lib/jquery/jquery.min.js"></script>
</body>
</html>
<script type="application/javascript">
    $(function(){
        function showImg(){
            $.ajax({
                type:'POST',
                url:'/vote/mobile/showImg',
                data:{},
                dataType:'json',
                success:function(json){
                    if(json.code == 0){
                        var str = "";
                        var data = json.data;
                        var number = new Array("零","一","二","三","四","五","六","七","八");
                        for (var i=0;i<data.length;i++){
                            var html = "<figure>\n" +
                                "\t\t\t<img src='"+data[i].userImg+"' alt='clouds and sky during daytime' title=\"Photo by Diego PH for Unsplash\">\n" +
                                "\t\t\t<figcaption>"+data[i].userName+"("+number[data[i].groupId]+"组)</figcaption>\n" +
                                "\t\t</figure>";
                            str =str+html;
                        }
                        $("#gallery").html(str);
                    }
                }
            });
        }
        showImg();

    });
</script>

<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
		<meta name="description" content="">
		<meta name="author" content="Webpixels">
		<title>礼物</title>
		<link type="text/css" href="../css/gift.css" rel="stylesheet">
		<script src="../lib/jquery/jquery.min.js"></script>
		<script src="../js/gift.js"></script>
	</head>
	<body>
	<div class="gallery-image-list">
		<div class="image-list">
			<div class="image img1"></div>
			<div class="image img2"></div>
			<div class="image img3"></div>
			<div class="image img4"></div>
			<div class="image img5"></div>
			<div class="image img6"></div>
		</div>
	</div>
	</body>
</html>

<script type="application/javascript">
	$(function(){
		showGift();
		function showGift(){
			$.ajax({
				type:'POST',
				url:'/vote/gift/showGift',
				data:{},
				dataType:'json',
				success:function(json){
					dealAjax(json);
				}
			});
		}
		function dealAjax(json){
			$(".img1").removeAttr('style');
			$(".img2").removeAttr('style');
			$(".img3").removeAttr('style');
			$(".img4").removeAttr('style');
			$(".img5").removeAttr('style');
			$(".img6").removeAttr('style');
			if(json.code == 0) {
				var data = json.data;
				for (var i=0;i<data.length;i++){
					$(".img"+data[i]['sort']).css('background-image', 'url("'+data[i]['giftImgUrl']+'")');
				}
			}
		}
		setInterval(function (){
			$.ajax({
				type:'POST',
				url:'/vote/gift/showGift',
				data:{},
				dataType:'json',
				success:function(json){
					dealAjax(json);
				}
			});
		},3000);
	});
</script>

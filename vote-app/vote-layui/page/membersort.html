<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
		<meta name="description" content="2024 向新而生">
		<meta name="author" content="Webpixels">
		<title id="title">排序-个人</title>
		<!-- Fonts -->
		<link href="https://fonts.googleapis.com/css?family=Nunito:400,600,700,800|Roboto:400,500,700" rel="stylesheet">
		<!-- Theme CSS -->
		<link type="text/css" href="../css/theme.css" rel="stylesheet">
		<!-- Demo CSS - No need to use these in your project -->
		<link type="text/css" href="../css/demo.css" rel="stylesheet">
		<link type="text/css" href="../css/style-btn.css" rel="stylesheet">
		<style type="text/css">
			.card-z {
				height: calc(50vh - 45px);
				box-sizing: border-box;
				margin: 30px 0 0 0;
				opacity: 0.9;
			}
			.num-m div {
				margin: 3px 0;
			}
		</style>
	</head>
	<body style="background-image: url(../images/bg.jpg); background-size: cover;">
		<div class="container-fluid">
			<div class="row list-sort">
			</div>
		</div>
		<input type="hidden" id="hidden" value="0"/>
		<!-- Core -->
		<script src="../lib/jquery/jquery.min.js"></script>
		<script src="../lib/popper/popper.min.js"></script>
		<script src="../js/bootstrap/bootstrap.min.js"></script>
		<!-- FontAwesome 5 -->
		<script src="../lib/fontawesome/js/fontawesome-all.min.js" defer></script>
		<!-- Page plugins -->
		<script src="../lib/bootstrap-select/js/bootstrap-select.min.js"></script>
		<script src="../lib/bootstrap-tagsinput/bootstrap-tagsinput.min.js"></script>
		<script src="../lib/input-mask/input-mask.min.js"></script>
		<script src="../lib/nouislider/js/nouislider.min.js"></script>
		<script src="../lib/textarea-autosize/textarea-autosize.min.js"></script>
		<!-- Theme JS -->
		<script src="../js/theme.js"></script>
	</body>
</html>
<script>
	$(function(){
		function showGroup(){
			var url_string = window.location.href;
			const url = new URL(url_string);
			let task = url.searchParams.get('task');
			$.ajax({
				type:'POST',
				url:'/vote/mobile/showMemberSort',
				data:{taskName:task},
				dataType:'json',
				success:function(json){
					if(json.code == 0){
						var data = json.data;
						var str = "";
						var number = new Array("零","一","二","三","四","五","六","七","八");
						for(var i=0;i<data.length;i++){
							var html = "<div class=\"col-lg-3\">\n" +
									"\t\t\t\t\t<div class=\"card card-z text-white border-0 overflow-hidden\"\n" +
									"\t\t\t\t\t\tstyle=\"background-image:url("+data[i].userImg+") ; background-size: cover;\">\n" +
									"\t\t\t\t\t\t<div class=\"card-header\">\n" +
									"\t\t\t\t\t\t\t<div class=\"row align-items-center\">\n" +
									"\t\t\t\t\t\t\t\t<div class=\"col-6\">\n" +
									"\t\t\t\t\t\t\t\t\t<h2 class=\"heading h5 mb-0\">"+data[i].userName+" &amp; "+data[i].groupName+"</h2>\n" +
									"\t\t\t\t\t\t\t\t</div>\n" +
									"\t\t\t\t\t\t\t</div>\n" +
									"\t\t\t\t\t\t</div>\n" +
									"\t\t\t\t\t\t<div class=\"card-body\" style='padding:0px'>\n" +
									"\t\t\t\t\t\t\t<p class=\"card-text sort-num sort"+data[i].groupId+"\" style=\"color: #fbca4d;text-align: center;font-family: 'Microsoft';font-size: 11rem;font-weight: 800;text-shadow: #000 11px 0 14px;\">"+data[i].serialNo+"</p>\n" +
									"\t\t\t\t\t\t</div>\n" +
									"\t\t\t\t\t\t<div class=\"btn-open\">\n" +
									"\t\t\t\t\t\t\t<label class=\"switch\">\n" +
									"\t\t\t\t\t\t\t\t<input class=\"switch__input btn\" groupId=\""+data[i].groupId+"\" type=\"checkbox\" role=\"switch\">\n" +
									"\t\t\t\t\t\t\t\t<span class=\"switch__base-outer\"></span>\n" +
									"\t\t\t\t\t\t\t\t<span class=\"switch__base-inner\"></span>\n" +
									"\t\t\t\t\t\t\t\t<svg class=\"switch__base-neon\" viewBox=\"0 0 40 24\" width=\"40px\" height=\"24px\">\n" +
									"\t\t\t\t\t\t\t\t\t<defs>\n" +
									"\t\t\t\t\t\t\t\t\t\t<filter id=\"switch-glow\">\n" +
									"\t\t\t\t\t\t\t\t\t\t\t<feGaussianBlur result=\"coloredBlur\" stddeviation=\"1\"></feGaussianBlur>\n" +
									"\t\t\t\t\t\t\t\t\t\t\t<feMerge>\n" +
									"\t\t\t\t\t\t\t\t\t\t\t\t<feMergeNode in=\"coloredBlur\"></feMergeNode>\n" +
									"\t\t\t\t\t\t\t\t\t\t\t\t<feMergeNode in=\"SourceGraphic\"></feMergeNode>\n" +
									"\t\t\t\t\t\t\t\t\t\t\t</feMerge>\n" +
									"\t\t\t\t\t\t\t\t\t\t</filter>\n" +
									"\t\t\t\t\t\t\t\t\t\t<linearGradient id=\"switch-gradient1\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n" +
									"\t\t\t\t\t\t\t\t\t\t\t<stop offset=\"0%\" stop-color=\"hsl(var(--on-hue1),90%,70%)\" />\n" +
									"\t\t\t\t\t\t\t\t\t\t\t<stop offset=\"100%\" stop-color=\"hsl(var(--on-hue2),90%,70%)\" />\n" +
									"\t\t\t\t\t\t\t\t\t\t</linearGradient>\n" +
									"\t\t\t\t\t\t\t\t\t\t<linearGradient id=\"switch-gradient2\" x1=\"0.7\" y1=\"0\" x2=\"0.3\" y2=\"1\">\n" +
									"\t\t\t\t\t\t\t\t\t\t\t<stop offset=\"25%\" stop-color=\"hsla(var(--on-hue1),90%,70%,0)\" />\n" +
									"\t\t\t\t\t\t\t\t\t\t\t<stop offset=\"50%\" stop-color=\"hsla(var(--on-hue1),90%,70%,0.3)\" />\n" +
									"\t\t\t\t\t\t\t\t\t\t\t<stop offset=\"100%\" stop-color=\"hsla(var(--on-hue2),90%,70%,0.3)\" />\n" +
									"\t\t\t\t\t\t\t\t\t\t</linearGradient>\n" +
									"\t\t\t\t\t\t\t\t\t</defs>\n" +
									"\t\t\t\t\t\t\t\t\t<path fill=\"none\" filter=\"url(#switch-glow)\" stroke=\"url(#switch-gradient1)\" stroke-width=\"1\" stroke-dasharray=\"0 104.26 0\" stroke-dashoffset=\"0.01\" stroke-linecap=\"round\" d=\"m.5,12C.5,5.649,5.649.5,12,.5h16c6.351,0,11.5,5.149,11.5,11.5s-5.149,11.5-11.5,11.5H12C5.649,23.5.5,18.351.5,12Z\"/>\n" +
									"\t\t\t\t\t\t\t\t</svg>\n" +
									"\t\t\t\t\t\t\t\t<span class=\"switch__knob-shadow\"></span>\n" +
									"\t\t\t\t\t\t\t\t<span class=\"switch__knob-container\">\n" +
									"\t\t\t\t\t\t\t\t\t<span class=\"switch__knob\">\n" +
									"\t\t\t\t\t\t\t\t\t\t<svg class=\"switch__knob-neon\" viewBox=\"0 0 48 48\" width=\"48px\" height=\"48px\">\n" +
									"\t\t\t\t\t\t\t\t\t\t\t<circle fill=\"none\" stroke=\"url(#switch-gradient2)\" stroke-dasharray=\"0 90.32 0 54.19\" stroke-linecap=\"round\" stroke-width=\"1\" r=\"23\" cx=\"24\" cy=\"24\" transform=\"rotate(-112.5,24,24)\" />\n" +
									"\t\t\t\t\t\t\t\t\t\t</svg>\n" +
									"\t\t\t\t\t\t\t\t\t</span>\n" +
									"\t\t\t\t\t\t\t\t</span>\n" +
									"\t\t\t\t\t\t\t\t<span class=\"switch__led\"></span>\n" +
									"\t\t\t\t\t\t\t\t<span class=\"switch__text\">Power</span>\n" +
									"\t\t\t\t\t\t\t</label>\n" +
									"\t\t\t\t\t\t</div>\n" +
									"\t\t\t\t\t</div>\n" +
									"\t\t\t\t</div>";
							var hidden= "<input type=\"hidden\" class=\"groupSort\" id=\"hidden_"+data[i].groupId+"\" value=\""+data[i].serialNo+"\"/>"
							str=str+html+hidden;
						}
						$(".list-sort").html(str);
						var start = new Array();
						$(".btn").bind("click",function(){
							var newVar = $(this).is(":checked");
							if(newVar){
								$(".btn").each(function(){
									$(this).attr("checked",true);
									//开始翻页
									var number = 0;
									start.push(sort($(this).attr("groupid")));
								})
							}else{
								$(".btn").each(function(index,item){
									$(this).attr("checked",false);
									var groupId = $(this).attr("groupid");
									setTimeout(function (){
										clearInterval(start[index]);
										var sort = $(".sort"+groupId).html();
										$("#hidden_"+groupId).val(sort);
										saveSort(sort,groupId);
									},1000*index);
								})
							}
						});
					}
				}
			});
		}
		showGroup();
		function sort(groupId){
			//开始翻页
			var number = 0;
			start = setInterval(function () {
				var arr = [1,2,3,4,5,6,7,8];
				$(".groupSort").each(function(){
					var num = $(this).val();
					arr = arr.filter(item=>item!=num);
				});
				if(number<arr.length){
					number++;
				}else{
					number = 0;
				}
				$(".sort"+groupId).html(arr[number]);
			},20)
			return start;
		}
		function saveSort(sort,groupId){
			$.ajax({
				type:'POST',
				url:'/vote/mobile/saveSort',
				data:{sort:sort,groupId:groupId},
				dataType:'json',
				success:function(json){
					if(json.code != 0){
						alert(json.msg);
					}
				}
			});
		}
	});
</script>

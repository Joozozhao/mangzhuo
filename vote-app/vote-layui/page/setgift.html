<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="utf-8">
    <title>北京微网通联 - 礼物控制中心</title>
    <link rel="stylesheet" type="text/css" href="../lib/semantic/dist/reset.css">
    <link rel="stylesheet" type="text/css" href="../lib/semantic/dist/components/menu.css">
    <link rel="stylesheet" type="text/css" href="../lib/semantic/dist/components/grid.css">
    <link rel="stylesheet" type="text/css" href="../lib/semantic/dist/semantic.css">
    <link rel="stylesheet" href="../lib/layui/css/layui.css"   media="all">
    <style type="text/css">
        .txt-ellipsis p {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body class="change-color">
<div class="layui-layout layui-layout-admin" style="padding: 20px;">
    <blockquote class="layui-elem-quote" style="font-size: 20px;margin-bottom: 20px;">礼物展示控制中心</blockquote>
    <div class="layui-form-item">
        <div class="layui-inline">
            <label class="layui-form-label">礼物1</label>
            <div class="layui-input-inline" style="width: 100px;">
                <input type="text" id="gift1" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">礼物2</label>
            <div class="layui-input-inline" style="width: 100px;">
                <input type="text" id="gift2" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">礼物3</label>
            <div class="layui-input-inline" style="width: 100px;">
                <input type="text" id="gift3" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">礼物4</label>
            <div class="layui-input-inline" style="width: 100px;">
                <input type="text" id="gift4" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">礼物5</label>
            <div class="layui-input-inline" style="width: 100px;">
                <input type="text" id="gift5" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">礼物6</label>
            <div class="layui-input-inline" style="width: 100px;">
                <input type="text" id="gift6" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">礼物7</label>
            <div class="layui-input-inline" style="width: 100px;">
                <input type="text" id="gift7" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">礼物8</label>
            <div class="layui-input-inline" style="width: 100px;">
                <input type="text" id="gift8" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-inline">
            <button type="button"  data-method="setTop" class="layui-btn showGift">礼物展示</button>
            <button type="button"  data-method="setTop" class="layui-btn delsort">清空排序</button>
        </div>
    </div>
    <table class="layui-hide" id="test" lay-filter="test"></table>
    <fieldset class="layui-elem-field layui-field-title" style="margin-top: 30px;"></fieldset>
</div>
<script type="text/html" id="barDemo">
    <img src="{{d.giftImgUrl}}" style="height: 50px;"/>
</script>

<script src="../lib/layui/layui.js"></script>
<script type="text/javascript">
    layui.use(['element','util','table','jquery'], function(){
        let $ = layui.$,
            layer = layui.layer,
            element = layui.element,
            table = layui.table;
        var tableIns = table.render({
            elem: '#test'
            ,url: '/vote/gift/list'
            ,cellMinWidth: 80 //全局定义常规单元格的最小宽度，layui 2.2.1 新增
            ,toolbar: '#state'
            ,cols: [[
                {field:'id', title: 'ID',align:'center'}
                ,{field:'giftName',align:'center',  title: '礼物名称'}
                ,{field:'giftImgUrl',align:'center', title: '礼物', toolbar: '#barDemo'}
            ]]
            ,page: true
        });
        $(".showGift").click(function(){
            var gift1 = $("#gift1").val();
            var gift2 = $("#gift2").val();
            var gift3 = $("#gift3").val();
            var gift4 = $("#gift4").val();
            var gift5 = $("#gift5").val();
            var gift6 = $("#gift6").val();
            var gift7 = $("#gift7").val();
            var gift8 = $("#gift8").val();
            layer.confirm("确定显示当前礼物设置吗", {
                btn: ['确定', '取消'] //可以无限个按钮
            }, function(index, layero){
                $.ajax({
                    type:'POST',
                    url:'/vote/gift/update',
                    data:{
                        gift1:gift1,
                        gift2:gift2,
                        gift3:gift3,
                        gift4:gift4,
                        gift5:gift5,
                        gift6:gift6,
                        gift7:gift7,
                        gift8:gift8,
                    },
                    dataType:'json',
                    success:function(json){
                        layer.msg("显示成功！", {icon: 1});
                        window.location.reload();
                    }
                });
                layer.close(index);
            }, function(index){
                layer.close(index);
            });
        });
        $(".delsort").click(function(){
            layer.confirm("确定清除当前礼物设置吗", {
                btn: ['确定', '取消'] //可以无限个按钮
            }, function(index, layero){
                $.ajax({
                    type:'POST',
                    url:'/vote/gift/delSort',
                    data:{},
                    dataType:'json',
                    success:function(json){
                        layer.msg("清除成功！", {icon: 1});
                        window.location.reload();
                    }
                });
                layer.close(index);
            }, function(index){
                layer.close(index);
            });
        });

        showGift();
        function showGift(){
            $.ajax({
                type:'POST',
                url:'/vote/gift/showGift',
                data:{},
                dataType:'json',
                success:function(json){
                    if(json.code == 0) {
                        var data = json.data;
                        for (var i=0;i<data.length;i++){
                            if(data[i]['sort'].indexOf(",")!=-1){
                                var split = data[i]['sort'].split(",");
                                for (var j = 0; j < split.length; j++) {
                                    $("#gift"+split[j]).val(data[i]['id']);
                                }
                            }else{
                                $("#gift"+data[i]['sort']).val(data[i]['id']);
                            }
                        }
                    }
                }
            });
        }
    });
</script>
</body>
</html>

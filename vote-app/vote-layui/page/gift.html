<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
		<meta name="description" content="">
		<meta name="author" content="Webpixels">
		<title>礼物</title>
		<link type="text/css" href="../css/gift.css" rel="stylesheet">
		<script src="../lib/jquery/jquery.min.js"></script>
		<script src="../js/gift.js"></script>
		<link type="text/css" href="../css/baxgmpo.css" rel="stylesheet">
		<script type="module" src="../js/baxgmpo.js"></script>
	</head>
	<body>
		<div id="app">
			<div class="gallery-image-list">
				<div class="image-list">
					<div class="image img1"></div>
					<div class="image img2"></div>
					<div class="image img3"></div>
					<div class="image img4"></div>
					<div class="image img5"></div>
					<div class="image img6"></div>
					<div class="image img7"></div>
					<div class="image img8"></div>
				</div>
			</div>
			<canvas id="webgl-canvas"></canvas>
		</div>
	</body>
</html>
<script type="application/javascript">
	$(function(){
		showGift();
		function showGift(){
			$.ajax({
				type:'POST',
				url:'/vote/gift/showGift',
				data:{},
				dataType:'json',
				success:function(json){
					dealAjax(json);
				}
			});
		}
		function dealAjax(json){
			$(".img1").removeAttr('style').hide();
			$(".img2").removeAttr('style').hide();
			$(".img3").removeAttr('style').hide();
			$(".img4").removeAttr('style').hide();
			$(".img5").removeAttr('style').hide();
			$(".img6").removeAttr('style').hide();
			$(".img7").removeAttr('style').hide();
			$(".img8").removeAttr('style').hide();
			$(".image-list").show();
			if(json.code == 0) {
				var data = json.data;
				for (var i=0;i<data.length;i++){
					if(data[i]['sort'].indexOf(",")!=-1){
						var split = data[i]['sort'].split(",");
						for (var j = 0; j < split.length; j++) {
							$(".img"+split[j]).css('background-image', 'url("'+data[i]['giftImgUrl']+'")').show();
						}
					}else{
						$(".img"+data[i]['sort']).css('background-image', 'url("'+data[i]['giftImgUrl']+'")').show();
					}
				}
			}else{
				$(".image-list").hide();
			}
		}
		setInterval(function (){
			$.ajax({
				type:'POST',
				url:'/vote/gift/showGift',
				data:{},
				dataType:'json',
				success:function(json){
					dealAjax(json);
				}
			});
		},3000);
	});
</script>

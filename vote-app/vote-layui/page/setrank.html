<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="utf-8">
    <title>北京微网通联 - 节目控制中心</title>
    <link rel="stylesheet" type="text/css" href="../lib/semantic/dist/reset.css">
    <link rel="stylesheet" type="text/css" href="../lib/semantic/dist/components/menu.css">
    <link rel="stylesheet" type="text/css" href="../lib/semantic/dist/components/grid.css">
    <link rel="stylesheet" type="text/css" href="../lib/semantic/dist/semantic.css">
    <link rel="stylesheet" href="../lib/layui/css/layui.css"   media="all">
    <style type="text/css">
        .txt-ellipsis p {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body class="change-color">
<div class="layui-layout layui-layout-admin" style="padding: 20px;">
    <blockquote class="layui-elem-quote" style="font-size: 20px;margin-bottom: 20px;">节目控制中心</blockquote>
    <table class="layui-hide" id="test" lay-filter="test"></table>
    <fieldset class="layui-elem-field layui-field-title" style="margin-top: 30px;"></fieldset>
</div>
<script type="text/html" id="barDemo">
    <input type="text" id="gift5" class="layui-input" style="height: 100px;">
</script>

<script src="../lib/layui/layui.js"></script>
<script type="text/javascript">
    layui.use(['element','util','table','jquery'], function(){
        let $ = layui.$,
            layer = layui.layer,
            element = layui.element,
            table = layui.table;
        var tableIns = table.render({
            elem: '#test'
            ,url: '/vote/gift/listrank'
            ,cellMinWidth: 80 //全局定义常规单元格的最小宽度，layui 2.2.1 新增
            ,toolbar: '#state'
            ,cols: [[
                {field:'id', title: 'ID',align:'center'}
                ,{field:'programName',align:'center',  title: '节目名称'}
                ,{field:'score',align:'center', title: '分数',edit: 'text'}
            ]]
            ,page: true
        });
        table.on('edit(test)', function(obj){ //注：edit是固定事件名，test是table原始容器的属性 lay-filter="对应的值"
            console.log(obj.value); //得到修改后的值
            console.log(obj.field); //当前编辑的字段名
            console.log(obj.data.id); //所在行的所有相关数据
            $.ajax({
                type:'POST',
                url:'/vote/gift/updatescore',
                data:{
                    id:obj.data.id,
                    score:obj.value,
                },
                dataType:'json',
                success:function(json){
                    layer.msg("设置成功！", {icon: 1});
                    window.location.reload();
                }
            });
        });
    });
</script>
</body>
</html>

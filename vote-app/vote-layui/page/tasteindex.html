<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>品酒</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/lib/layui-v2.10.3/css/layui.css" rel="stylesheet">
</head>
<body>
<div style="padding: 16px;">
    <blockquote class="layui-elem-quote" style="font-size: 20px;margin-bottom: 20px;">品酒</blockquote>
    <table class="layui-hide" id="test" lay-filter="test"></table>
</div>
<script type="text/html" id="toolbarDemo">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm left" lay-event="showCreateTaste">创建</button>
    </div>
</script>
<script type="text/html" id="toolDemo">
    <div class="layui-clear-space">
        {{#  if(d.status == 1){ }}
            {{#  if(d.is_show == 1){ }}
            <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
            {{#  } }}
            <a class="layui-btn layui-btn-xs" lay-event="detail">详情</a>
        {{#  } }}
        {{#  if(d.status == 0){ }}
            <a class="layui-btn layui-btn-xs" lay-event="vote">投票</a>
        {{#  } }}
    </div>
</script>
<script type="text/html" id="statusTable">
    {{#  if(d.is_status_show == 1){ }}
        {{#  if(d.status == 0){ }}
        <input type="checkbox" name="status" id="status{{= d.id }}" value="{{= d.id }}" title="开启|停止" lay-skin="switch" lay-filter="statusFilter" checked>
        {{#  } }}
        {{#  if(d.status == 1){ }}
        <input type="checkbox" name="status" id="status{{= d.id }}" value="{{= d.id }}" title="开启|停止" lay-skin="switch" lay-filter="statusFilter">
        {{#  } }}
    {{#  } }}
    {{#  if(d.is_status_show == 0){ }}
        {{#  if(d.status == 0){ }}
        <input type="checkbox" name="status" id="status{{= d.id }}" value="{{= d.id }}" title="开启|停止" lay-skin="switch" disabled lay-filter="statusFilter" checked>
        {{#  } }}
        {{#  if(d.status == 1){ }}
        <input type="checkbox" name="status" id="status{{= d.id }}" value="{{= d.id }}" title="开启|停止" lay-skin="switch" lay-filter="statusFilter" disabled>
        {{#  } }}
    {{#  } }}
</script>
<script src="/lib/layui-v2.10.3/layui.js"></script>
<script>
    layui.use(['table', 'dropdown','form','jquery'], function(){
        var table = layui.table
            ,form = layui.form
            ,$ = layui.$;
        // 创建渲染实例
        table.render({
            elem: '#test',
            url: '/taste/wechat/tastelist', // 此处为静态模拟数据，实际使用时需换成真实接口
            toolbar: '#toolbarDemo',
            defaultToolbar: false,
            page: true,
            cols: [[
                {field:'tasteName', title: '名称'},
                {field:'nickname', title: '创建者'},
                {field:'status', title: '状态',width: 90, minWidth:70, templet: '#statusTable'},
                {fixed: 'right', title:'操作',width: 145, minWidth: 130,templet: '#toolDemo'}
            ]],
            xhrFields: { // 设置 xhrFields，用以设置 withCredentials 属性
                withCredentials: true // 开启跨域请求时携带凭证信息（如 cookies）
            },
            error: function(res, msg){
                // console.log(res, msg)
            }
        });
        table.on('toolbar(test)', function(obj){
            var checkStatus = table.checkStatus(obj.config.id);
            switch(obj.event){
                case 'showCreateTaste':
                    window.location.href="/page/createtaste.html"
                    break;
            }
        });
        table.on('tool(test)', function(obj){
            var data = obj.data;
            if(obj.event === 'edit'){
                window.location.href="/page/updatetaste.html?id="+data.id;
            } else if(obj.event === 'vote'){
                window.location.href="/page/votetaste.html?id="+data.id;
            }else if(obj.event === 'detail'){
                window.location.href="/page/votedetail.html?id="+data.id;
            }
        });
        form.on('switch(statusFilter)', function (data) {
            var status = 1;
            if(data.elem.checked){
                status = 0;
            }
            var id = data.value;
            $.ajax({
                type:'POST',
                url:'/taste/wechat/updatetastestatus',
                data:{
                    id:id,
                    status:status
                },
                xhrFields: { // 设置 xhrFields，用以设置 withCredentials 属性
                    withCredentials: true // 开启跨域请求时携带凭证信息（如 cookies）
                },
                dataType:'json',
                success:function(json){
                    if(json.code == 0){
                        //成功
                        layer.msg('保存成功！',  {time: 500,icon: 1},function(){
                            window.location.reload();
                        });
                    }else{
                        layer.msg('保存失败！', {time: 500, icon: -1}, function() {
                            if(status ==0){
                                $("#status"+id).removeProp("checked");
                            }else{
                                $("#status"+id).prop("checked",true);
                            }
                        });
                    }
                }
            });
        });
    });
</script>
</body>
</html>

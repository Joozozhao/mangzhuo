<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
		<meta name="description" content="2024 向新而生">
		<meta name="author" content="Webpixels">
		<title>排行榜-组</title>
		<!-- Fonts -->
		<link href="https://fonts.googleapis.com/css?family=Nunito:400,600,700,800|Roboto:400,500,700" rel="stylesheet">
		<!-- Theme CSS -->
		<link type="text/css" href="../css/theme.css" rel="stylesheet">
		<!-- Demo CSS - No need to use these in your project -->
		<link type="text/css" href="../css/demo.css" rel="stylesheet">
		<style type="text/css">
			.card-z {
				height: calc(50vh - 45px);
				box-sizing: border-box;
				margin: 30px 0 0 0;
				opacity: 0.9;
			}

			.num-m div {
				margin: 3px 0;
			}
		</style>
	</head>
	<body style="background-image: url(../images/bg.jpg); background-size: cover;">
		<div class="container-fluid">
			<div class="row sort-info">
			</div>
		</div>
		<!-- Core -->
		<script src="../lib/jquery/jquery.min.js"></script>
		<script src="../lib/popper/popper.min.js"></script>
		<script src="../js/bootstrap/bootstrap.min.js"></script>
		<!-- FontAwesome 5 -->
		<script src="../lib/fontawesome/js/fontawesome-all.min.js" defer></script>
		<!-- Page plugins -->
		<script src="../lib/bootstrap-select/js/bootstrap-select.min.js"></script>
		<script src="../lib/bootstrap-tagsinput/bootstrap-tagsinput.min.js"></script>
		<script src="../lib/input-mask/input-mask.min.js"></script>
		<script src="../lib/nouislider/js/nouislider.min.js"></script>
		<script src="../lib/textarea-autosize/textarea-autosize.min.js"></script>
		<!-- Theme JS -->
		<script src="../js/theme.js"></script>
	</body>
</html>
<script src="../lib/layui/layui.js"></script>
<script type="text/javascript">
	layui.use(['layer'], function(){
		let $ = layui.$, layer = layui.layer;
		function dealAjax(json){
			if(json.code == 0){
				var data = json.data.list;
				var str = "";
				var number = new Array("零","一","二","三","四","五","六","七","八");
				var num = 1;
				for (var i=data.length-1;i>=0;i--){
					var scoreNum = json.data.set.indexOf(data[i].groupScore) +1;
					var img = "";
					if(data[i].groupScore != 0){
						img = "<i class=\"fas fa-heart fa-3x\" style='color: #ff0033'></i>第 "+scoreNum+" 名";
						if(num<=3){
							img = "<img src=\"../images/"+scoreNum+".png\" class=\" avatar-lg\">";//"<i class=\"fas fa-list-ol fa-3x\"></i>";
						}
					}else{
						img = "<i class=\"fas fa-heart fa-3x\" style='color: #ff0033'></i>";
					}
					//队员信息
					var member = data[i].listMember;
					var forNum = Math.ceil(member.length/3);
					var strMember = ""
					for (var j=0;j<forNum;j++){
						var number1 = 3 * j;
						var number2 = 3 * j+1;
						var number3 = 3 * j+2;
						if(3*j<=member.length-1){
							strMember = strMember + "<span class=\"badge badge-dot mr-1\">\n" +
									"\t\t\t\t\t\t\t\t    <i class=\"bg-green\"></i> "+member[number1].userName+"\n" +
									"\t\t\t\t\t\t\t\t</span>";
						}
						if(3*j+1<=member.length-1){
							strMember = strMember + "<span class=\"badge badge-dot mr-1\">\n" +
									"\t\t\t\t\t\t\t\t    <i class=\"bg-warning\"></i>"+member[number2].userName+"\n" +
									"\t\t\t\t\t\t\t\t</span>";
						}
						if(3*j+2<=member.length-1){
							strMember = strMember + "<span class=\"badge badge-dot mr-1\">\n" +
									"\t\t\t\t\t\t\t\t    <i class=\"bg-blue\"></i>"+member[number3].userName+"\n" +
									"\t\t\t\t\t\t\t\t</span>";
						}
					}
					//活动信息
					var activeScore = data[i].listActiveScore;
					var forNum = Math.ceil(activeScore.length/3);
					var strActive = ""
					for (var j=0;j<forNum;j++){
						var number1 = 3 * j;
						var number2 = 3 * j+1;
						var number3 = 3 * j+2;
						if(3*j<=activeScore.length-1){
							strActive = strActive + "<div><span class=\"badge badge-lg badge-pill badge-info text-uppercase\">\n" +
									"\t\t\t\t\t\t\t\t\t\t\t"+activeScore[number1].actyName+" : "+activeScore[number1].score+"</span></div>";
						}
						if(3*j+1<=activeScore.length-1){
							strActive = strActive + "<div><span class=\"badge badge-lg badge-pill badge-secondary text-uppercase\">\n" +
									"\t\t\t\t\t\t\t\t\t\t\t"+activeScore[number2].actyName+" : "+activeScore[number2].score+"</span></div>";
						}
						if(3*j+2<=activeScore.length-1){
							strActive = strActive + "<div><span class=\"badge badge-lg badge-pill badge-tertiary text-uppercase\">\n" +
									"\t\t\t\t\t\t\t\t\t\t\t"+activeScore[number3].actyName+" : "+activeScore[number3].score+"</span></div>";
						}
					}
					var html = "<div class=\"col-lg-3\">\n" +
							"\t\t\t\t\t<div class=\"card card-z text-white border-0 overflow-hidden\"\n" +
							"\t\t\t\t\t\tstyle=\"background-image:url("+data[i].groupImg+") ; background-size: cover;\">\n" +
							"\t\t\t\t\t\t<div class=\"card-header\">\n" +
							"\t\t\t\t\t\t\t<div class=\"row align-items-center\">\n" +
							"\t\t\t\t\t\t\t\t<div class=\"col-6\">\n" +
							"\t\t\t\t\t\t\t\t\t<h2 class=\"heading h5 mb-0\">"+number[data[i].groupId]+"组 &amp; "+data[i].groupName+"</h2>\n" +
							"\t\t\t\t\t\t\t\t</div>\n" +
							"\t\t\t\t\t\t\t\t<div class=\"col-6\">\n" +
							"\t\t\t\t\t\t\t\t\t<div class=\"card-icon-actions text-right\" style=\"color: black;\">\n" +
							"\t\t\t\t\t\t\t\t\t\t"+img+"\n" +
							"\t\t\t\t\t\t\t\t\t</div>\n" +
							"\t\t\t\t\t\t\t\t</div>\n" +
							"\t\t\t\t\t\t\t</div>\n" +
							"\t\t\t\t\t\t</div>\n" +
							"\t\t\t\t\t\t<div class=\"card-body\">\n" +
							"\t\t\t\t\t\t\t<div class=\"list-member\">\n" +strMember+
							"\t\t\t\t\t\t\t</div>\n" +
							"\t\t\t\t\t\t</div>\n" +
							"\t\t\t\t\t\t<div class=\"card-footer\" style=\"background-image: linear-gradient(to top, black 0%, rgba(0, 0, 0, 0) 100%); opacity: 0.8;\">\n" +
							"\t\t\t\t\t\t\t<div class=\"row align-items-center\" style=\"opacity: 1;\">\n" +
							"\t\t\t\t\t\t\t\t<div class=\"col-6 num-m\">\n" +strActive+
							"\t\t\t\t\t\t\t\t</div>\n" +
							"\t\t\t\t\t\t\t\t<div class=\"col-6 text-right\">\n" +
							"\t\t\t\t\t\t\t\t\t<a href=\"#\" class=\"badge-pill badge-secondary btn-lg btn-primary\">票数："+data[i].groupScore+"</a>\n" +
							"\t\t\t\t\t\t\t\t</div>\n" +
							"\t\t\t\t\t\t\t</div>\n" +
							"\t\t\t\t\t\t</div>\n" +
							"\n" +
							"\t\t\t\t\t</div>\n" +
							"\t\t\t\t</div>"
					num++;
					str = str + html;
				}
				$(".sort-info").html(str);
			}
		}
		function showSort(){
			$.ajax({
				type:'POST',
				url:'/vote/mobile/showSort',
				data:{},
				dataType:'json',
				success:function(json){
					dealAjax(json)
				}
			});
		}
		showSort();
		setInterval(function (){
		 	$.ajax({
		 		type:'POST',
		 		url:'/vote/mobile/showSort',
		 		data:{},
		 		dataType:'json',
		 		success:function(json){
		 			dealAjax(json)
		 		}
		 	});
		 },3000);
	});
</script>

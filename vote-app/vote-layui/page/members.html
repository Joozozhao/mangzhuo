<script type="application/javascript">
	$(function(){
		showMembers();
		function showMembers(){
			$.ajax({
				type:'POST',
				url:'/vote/mobile/showMembers',
				data:{},
				dataType:'json',
				success:function(json){
					dealAjax(json);
				}
			});
		}
		function dealAjax(json){
			if(json.code == 0) {
				var data = json.data.memberScore;
				var listMembers = "";
				var number = new Array("零","一","二","三","四","五","六","七","八");
				for (var i=0;i<data.length;i++){
					num = i+1;
					var scoreNum = json.data.set.indexOf(data[i].sumScore) +1;
					$("#img"+ num).attr("src",data[i].userImg);
					$("#h"+ num).html(data[i].userName);
					$("#span"+ num).html(number[data[i].groupId]+"组 & "+data[i].groupName);
					$("#score"+ num).html(data[i].sumScore);
					$("#sortimg"+ num).attr("src","../images/5.jpg");
					if(scoreNum<=3){
						$("#sortimg"+ num).attr("src","../images/"+scoreNum+".png");
					}

				}
			}
		}
		setInterval(function (){
			$.ajax({
				type:'POST',
				url:'/vote/mobile/showMembers',
				data:{},
				dataType:'json',
				success:function(json){
					dealAjax(json);
				}
			});
		},3000);
	});
</script>

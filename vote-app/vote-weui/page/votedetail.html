<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>品酒</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script rel="stylesheet" src="../lib/jquery/jquery.min.js"></script>
    <link href="/lib/layui-v2.10.3/css/layui.css" rel="stylesheet">
</head>
<body>
<div class="swiper-slide"><img id="taste-img" src="../image/1.png" alt="" width="100%" height="200"/></div>
<div style="padding: 5px;">
    <table class="layui-hide" id="test" lay-filter="test"></table>
</div>
<div class="swiper-slide" style="margin-top: 15px;"><img id="taste-url-img" src="../image/1.png" alt="" width="100%" height="200"/></div>
<link rel="stylesheet" href="../dist/style/weui.min.css"/>
<div class="weui-cells__title" style="font-size: 17px;">排行榜</div>
<div class="weui-cells list-sort">
</div>
<script type="text/html" id="toolbarDemo">
    <div class="layui-btn-container">
        <a href="javascript:history.back();" class="layui-btn layui-btn-sm">返回</a>
        &nbsp;&nbsp;
        <a href="#" onclick="downloadXls()" class="layui-btn layui-btn-sm">导出数据</a>
    </div>
    <input type="text" id="tasteId" style="display:none;">
</script>
<script src="/lib/layui-v2.10.3/layui.js"></script>
<script>
    $(function(){
        var id = getParameterByName("id");
        if(id == "" || id==null || id==undefined){
            window.location.href="/page/tasteindex.html";
        }
        $("#tasteId").val(id);
        $.ajax({
            type:'POST',
            url:'/taste/wechat/gettaste',
            data:{
                id:id,
                sort: "",
            },
            dataType:'json',
            success:function(json){
                if(json.code == 0){
                    $("#taste-img").attr("src",json.data.imgUrl);
                    if(json.data.tasteUrl!=null){
                        $("#taste-url-img").attr("src",json.data.tasteUrl);
                    }else{
                        $("#taste-url-img").hide();
                    }
                }else{
                    // window.location.href="/page/tasteindex.html";
                    if(json.msg == "relogin"){
                        window.location.href = "/page/wechat.html";
                    }else{
                        window.location.href="/page/tasteindex.html";
                    }
                }
            }
        });
    });
    function downloadXls() {
        var url = window.location.href;
        var id = url.match(/[\?&]id=([^&#]*)/)[1];
        window.location.href = '/taste/wechat/downloadXls?tasteId=' + id
    }
    function getParameterByName(name) {
        name = name.replace(/[\[]/, "\\[").replace(/[\]]/, "\\]");
        var regex = new RegExp("[\\?&]" + name + "=([^&#]*)"),
            results = regex.exec(location.search);
        return results === null ? "" : decodeURIComponent(results[1].replace(/\+/g, " "));
    }
    layui.use(['table','jquery'], function(){
        var table = layui.table
            ,$ = layui.$;
        // 创建渲染实例
        var id = getParameterByName("id");
        if(id == "" || id==null || id==undefined){
            window.location.href="/page/tasteindex.html";
        }
        $.ajax({
            type:'POST',
            url:'/taste/wechat/getcolumns',
            data:{
                tasteId:id
            },
            dataType:'json',
            success:function(json){
                if(json.code == 0){
                    initTable(json.data);
                }else{
                    layer.msg('保存失败！', {time: 500, icon: -1}, function() {
                        if(status ==0){
                            $("#status"+id).removeProp("checked");
                        }else{
                            $("#status"+id).prop("checked",true);
                        }
                    });
                }
            }
        });
        function initTable(columns){
            table.render({
                elem: '#test',
                url: '/taste/wechat/getvotedetail?tasteId='+id, // 此处为静态模拟数据，实际使用时需换成真实接口
                toolbar: '#toolbarDemo',
                defaultToolbar: false,
                page: false,
                cols: [columns],
                done: function (res, curr, count) {
                    // console.log(res);
                    //解决操作栏因为内容过多换行问题
                    $(".layui-table-main tr").each(function (index, val) {
                        $($(".layui-table-fixed-l .layui-table-body tbody tr")[index]).height($(val).height());
                        $($(".layui-table-fixed-r .layui-table-body tbody tr")[index]).height($(val).height());
                    });
                    var data = res.data;
                    if(res.code == 0){
                        for(var i=0;i<data.length-2;i++){
                            Object.keys(data[i]).forEach(function(key) {
                                if(key.indexOf("field")!=-1){
                                    var isShowKey =key.replace("field","judge_result");
                                    if(data[i][isShowKey]==1){
                                        $("td[data-field='"+key+"']",$("tr[data-index='"+i+"']")).css("color","#04F408");
                                    }else{
                                        $("td[data-field='"+key+"']",$("tr[data-index='"+i+"']")).css("color","#5f5f5f")
                                    }
                                }
                            });
                        }
                        //平均数
                        var score=[];
                        Object.keys(data[data.length-1]).forEach(function(key) {
                            if(key.indexOf("score")!=-1){
                                var id =key.replace("score","");
                                var value = data[data.length-1][key];
                                score[id] = value;
                            }
                        });
                        $.ajax({
                            type:'POST',
                            url:'/taste/wechat/gettastetype',
                            data:{
                                tasteId:id
                            },
                            dataType:'json',
                            success:function(json){
                                if(json.code == 0){
                                    var num=1;
                                    var str = "";
                                    var sortObj = [];
                                    for (var i=0;i<score.length;i++){
                                        if(score[i]!=null && score[i]!="" && score[i]!=undefined){
                                            var tasteType = json.data;
                                            var sort = {};
                                            for (var j=0;j<tasteType.length;j++){
                                                if(tasteType[j]['id'] == i){
                                                    sort.name=tasteType[j]['tasteType'];
                                                    sort.score = score[i];
                                                    sortObj.push(sort);
                                                }
                                            }
                                        }
                                    }
                                    sortObj.sort((a, b) => b.score - a.score);
                                    Object.keys(sortObj).forEach(function(key) {
                                        var list_html = "<div role=\"option\" class=\"weui-cell  weui-cell_example\">\n" +
                                            "        <div class=\"weui-cell__hd\"></div>\n" +
                                            "        <div class=\"weui-cell__bd\">\n" +
                                            "            <p>"+sortObj[key]['score']+"分</p>\n" +
                                            "        </div>\n" +
                                            "        <div class=\"weui-cell__ft\">"+sortObj[key]['name']+"</div>\n" +
                                            "    </div>";
                                        num++;
                                        str = str+list_html;
                                    });
                                    $(".list-sort").html(str);
                                }
                            }
                        });

                    }
                },
                xhrFields: { // 设置 xhrFields，用以设置 withCredentials 属性
                    withCredentials: true // 开启跨域请求时携带凭证信息（如 cookies）
                },
                error: function(res, msg){
                    // console.log(res, msg)
                }
            });
        }
    });
</script>
</body>
</html>

<style type="text/css">
    .layui-table-cell {
        height:auto;
        overflow:visible;
        text-overflow:inherit;
        white-space:normal;
        word-break: break-all;
    }
</style>

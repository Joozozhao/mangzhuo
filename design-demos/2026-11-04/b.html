<body>
<div class="app">

    <button type="button" data-page="gather"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h18M5 10v10m14-10v10M6 4h4v3a2 2 0 0 1-4 0Zm8 0h4v3a2 2 0 0 1-4 0Z"/></svg>酒局</button>
    <button type="button" data-page="knowledge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v15M3 4c4-1 7 0 9 2 2-2 5-3 9-2v15c-4-1-7-1-9 1-2-2-5-2-9-1Z"/></svg>酒识</button>
    <button type="button" data-page="mine"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>我的</button>

<script>
'use strict';
const $=s=>document.querySelector(s), pages=['home','gather','knowledge','mine'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NOTE_KEY='mangzhuo-prototype-b-notes-v1', TABLE_KEY='mangzhuo-prototype-b-table-v1';
const aromas=['暂不判断','酱香','清香','浓香','其他'];
const demos=[
  {id:'demo-jiang',title:'初识酱香',feeling:'先闻到一点烘烤与粮食的气息。入口有层次，收尾仍留着温热感。先写下自己的联想，揭晓后再补酒款。',aroma:'酱香',wine:'未填写酒款',date:'2026.11.02',demo:true},
  {id:'demo-qing',title:'一杯清香的午后',feeling:'清晰的粮香，入口利落。回味很轻，像一句刚刚好说完的话。这是演示手记，不代表任何真实酒款。',aroma:'清香',wine:'未填写酒款',date:'2026.10.30',demo:true}
];
// 原文摘录：miniprogram/utils/knowledge.js；不将仓库资料作为最新核验结论。
const articles=[
 {id:'styles',category:'香型入门',title:'香型，是认识白酒的第一张地图',desc:'先认识酱香、浓香、清香，再建立自己的感官记忆。',paragraphs:['白酒产品标准按不同类别分别制定。香型可以帮助我们整理酒款，但不能单独说明一瓶酒的价格、品质或是否适合自己。','入门可以先挑选明确标注香型的酒款，分别建立酱香、浓香、清香的记录页。同一香型下也存在不同产品风格，不必寻找一个适用于所有酒款的唯一答案。','对比时先写自己的观察，揭晓后再补全瓶身信息。把“包装标注的香型”和“我闻到的香气”分别记录，日后复盘会更清晰。'],tip:'为最近一次打卡补上瓶身标注的香型。',source:'全国标准信息公共服务平台 · 白酒标准检索'},
 {id:'observe',category:'盲品风味',title:'先闻香，再写下第一印象',desc:'从自己的感受开始，不急着猜酒名。',paragraphs:['把酒样按编号放好，先记下第一印象，再与其他酒样比较。每次使用相同的杯型和接近的倒酒量，方便对比。','描述香气时，可以从熟悉的食物与气味找词：粮食、果香、花香、烘烤。没有闻到某种香气，也不需要照着别人的答案填写。','品评记录可以分为闻香、入口、回味三段。喜欢与不喜欢都可以记录，具体描述比一个总分更有价值。'],tip:'打开品酒打卡，把这一篇的方法用在自己的记录里。'},
 {id:'blind',category:'盲品风味',title:'一场盲品，怎样开始',desc:'编号、独立记录、最后揭晓。',paragraphs:['由一位组织者保存真实酒款信息，为每个样品分配编号。品鉴者在揭晓前以编号记录。','先独立填写感受，再一起讨论，可以减少别人先说出的酒名或评价对自己的影响。','揭晓后分别回看“我猜的是什么”和“我是否喜欢”。它们回答的是两个不同的问题。'],tip:'打开品酒打卡，把这一篇的方法用在自己的记录里。'},
 {id:'read',category:'名酒档案',title:'读一张酒标，记住哪些信息',desc:'酒款名称、香型与酒精度，先建立清晰记录。',paragraphs:['记录包装上的完整产品名称、香型和酒精度，同一品牌下的不同产品应分别记录。','如果需要做长期对比，也可以在手记里补充生产日期、批次及品饮日期，方便之后回看。','产品名称中的数字和瓶身上的日期，应按各自标注原样记录；不要直接把名称中的数字当成整瓶酒的实际酒龄。'],tip:'打开品酒打卡，把这一篇的方法用在自己的记录里。'}
];
// 以下风味与档案来自 miniprogram/data/liquor-knowledge.js（2026-10-03）。
const extras=[
 {id:'flavor-aroma',category:'盲品风味',title:'闻香：先找熟悉的气味',desc:'粮香、米香、果香、花香。',paragraphs:['先找熟悉的气味联想，再写细节。','粮香：让你联想到谷物、蒸粮或熟粮的气味。','米香：与米饭、米浆或米制食物有关的个人联想。','果香：让你想起水果的气味，可继续写出具体水果。','花香：与花朵有关的香气联想，不要求辨出花种。'],tip:'风味词和练习为编辑整理，不是酒款鉴定结论。',library:true},

let notes=[],storageWarning='',page='home',mode='table',category='香型入门',query='',selectedSample=0,room=null,returnFocus=null,toastTimer;
try{const raw=JSON.parse(localStorage.getItem(NOTE_KEY)||'[]');if(!Array.isArray(raw))throw Error('invalid');notes=raw.filter(n=>n&&typeof n.title==='string'&&typeof n.feeling==='string').slice(0,100).map((n,i)=>({id:'local-'+i,title:n.title.slice(0,60),feeling:n.feeling.slice(0,1200),wine:String(n.wine||'未填写酒款').slice(0,80),aroma:aromas.includes(n.aroma)?n.aroma:'暂不判断',date:String(n.date||'本地记录').slice(0,30),demo:false}));}catch{storageWarning='本地记录暂不可读取，新记录仍可尝试保存。';}
const allNotes=()=>[...notes,...demos];
const action=(label,name,cls='outline',extra='')=>`<button type="button" class="${cls}" data-action="${name}" ${extra}>${label}</button>`;

function openSheet(title,html){if(!$('#sheet').open)returnFocus=document.activeElement;$('#sheet-title').textContent=title;$('#sheet-body').innerHTML=html;if(!$('#sheet').open)$('#sheet').showModal();$('#sheet').scrollTop=0;$('#sheet-title').focus({preventScroll:true});}

$('#sheet').addEventListener('close',()=>{if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true});else $('#main').focus({preventScroll:true});});
$('#sheet').addEventListener('click',e=>{if(e.target===$('#sheet')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeSheet();}});
function noteRows(list){return list.map((n,i)=>`<button type="button" class="note-row" data-note="${esc(n.id)}"><span class="idx number">${String(i+1).padStart(2,'0')}</span><span class="row-copy"><strong>${esc(n.title)}</strong><small>${esc(n.aroma)} · ${esc(n.date)} · ${n.demo?'演示手记':'本地手记'}</small></span><span class="arrow" aria-hidden="true">↗</span></button>`).join('');}
function renderHome(){return `<section class="page home"><div class="invite-top"><span class="eyebrow">NIGHT TASTING CLUB</span><span class="small">私享品鉴手记</span></div><div class="brand-stage"><div class="brand-title" aria-hidden="true">盲<span>酌</span></div><img class="libai" src="../../miniprogram/assets/brand/libai-home.png" width="166" height="166" alt="李白举杯剪影"><span class="vertical-note">今晚，只谈杯中味。</span></div><h1>记下这一杯</h1><p class="home-sub">记酒款，记风味，也记相聚。</p>${action('<span>记一杯</span><span class="plus" aria-hidden="true">＋</span>','new-note','cta')}${action('<span>制作分享酒卡</span><span aria-hidden="true">↗</span>','share','text-link')}<section class="paper recent" aria-labelledby="recent-title"><div class="section-head"><h2 id="recent-title">最近手记</h2><span class="eyebrow">THE TASTING NOTES</span></div>${noteRows(allNotes().slice(0,3))}</section></section>`;}
function renderGather(){const online=mode==='online';return `<section class="page"><div class="eyebrow amber">02 / 与知己入席</div><div class="page-heading"><h1>和知己，<br>品一局</h1><p>先把酒标放下，把自己的感受留下。</p></div><div class="mode-switch" aria-label="品鉴模式"><button type="button" data-mode="table" aria-pressed="${!online}">桌上品鉴</button><button type="button" data-mode="online" aria-pressed="${online}">在线品鉴</button></div><section class="ticket"><div class="eyebrow">${online?'ONLINE SESSION / 待登录':'TABLE SESSION / 在同一张桌上'}</div><h2>${online?'各自举杯，<br>也能同席。':'先写感受，<br>最后揭晓。'}</h2><p>${online?'在线酒局需要微信身份与真实后台。':'给酒样编号，邀朋友坐下。<br>从第一印象开始，不急着猜酒名。'}</p>${action(`<span>${online?'发起在线酒局':'发起桌上酒局'}</span><span aria-hidden="true">↗</span>`,'create-room','cta')}<div class="steps"><span>01 · 编号</span><span>02 · 独立记录</span><span>03 · 揭晓</span></div></section><p class="connection">${online?'待登录微信 · 未连接在线服务 · 仅可体验本地示例':'本页为演示 · 桌上演练仅保存在此浏览器'}</p><section class="join"><h2>已有邀请？凭编号入席</h2><form id="join-form"><label class="sr-only" for="room-code">四位演示房间号</label><div class="inline-form"><input id="room-code" name="code" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="输入 2026" autocomplete="off" required aria-describedby="join-help join-error"><button type="submit" class="outline">加入</button></div><p id="join-help" class="small muted" style="margin-top:8px">仅支持演示房间号 2026，不连接真实房间。</p><p class="form-error" id="join-error" role="alert"></p></form></section><section class="sample-room"><div class="sample-head"><span class="eyebrow amber">AN OPEN INVITATION</span>${hint()}</div><h3>周五盲品小聚</h3><p class="room-meta">3 款酒样 / 4 人（演示） / 房间号 2026</p>${action('<span>体验示例局</span><span aria-hidden="true">↗</span>','example-room','text-link')}</section></section>`;}
function filteredArticles(){const pool=category==='慢读文章'?articles:[...articles,...extras].filter(a=>a.category===category);const q=query.trim().toLowerCase();return pool.filter(a=>(a.title+a.desc+a.paragraphs.join('')).toLowerCase().includes(q));}

function renderKnowledge(){return `<section class="page"><div class="eyebrow amber">03 / 风味阅读室</div><div class="page-heading"><h1>读懂杯中味</h1><p>读一点，再回到自己的杯子里。</p></div><form class="search" id="search-form" role="search"><label class="sr-only" for="search">搜索当前酒识分类</label><input id="search" name="query" type="search" maxlength="80" placeholder="搜索香型、风味、酒标" value="${esc(query)}"><button type="submit" aria-label="搜索酒识"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg></button></form><div class="categories" aria-label="酒识分类">${['香型入门','盲品风味','名酒档案','慢读文章'].map(c=>`<button type="button" data-category="${c}" aria-pressed="${category===c}">${c}</button>`).join('')}</div><div id="article-list" aria-live="polite">${articleRows()}</div><p class="small muted" style="margin-top:20px">内容沿用仓库资料，未作最新标准核验。<br>具体产品信息以酒标为准。</p></section>`;}
function renderMine(){const count=new Set(allNotes().map(n=>n.aroma).filter(a=>a!=='暂不判断')).size;return `<section class="page"><div class="eyebrow amber">04 / 个人品鉴档案</div><div class="identity"><div class="avatar" aria-hidden="true">酌</div><div><h1>品鉴者 <span class="tag amber">演示</span></h1><p>未登录微信 · 当前原型浏览器</p></div></div><div class="stats"><div class="stat"><b>${allNotes().length}</b><span>篇手记</span></div><div class="stat"><b>1</b><span>场酒局 · 演示</span></div><div class="stat"><b>${count}</b><span>种香型</span></div></div><p class="stats-caption">含 2 篇演示手记、1 场示例酒局${notes.length?'；另有 '+notes.length+' 篇本地手记':''}。</p><p class="manifesto">只留，<br>自己的判断。</p><div>${[['01','个人手记','notes',allNotes().length+' 篇'],['02','酒局记录','table-record','演示 / 本地'],['03','个人资料','profile','演示身份'],['04','关于盲酌','about','夜酌俱乐部']].map(([i,t,a,s])=>`<button type="button" class="archive-row" data-action="${a}"><span class="eyebrow">${i}</span><strong>${t}</strong><span class="muted">${s}</span><span class="arrow" aria-hidden="true">↗</span></button>`).join('')}</div><p class="small muted" style="margin-top:22px">手记仅在当前原型浏览器保存。<br>没有云端同步；更换浏览器或清除数据后不可恢复。</p>${storageWarning?`<p class="form-error">${esc(storageWarning)}</p>`:''}</section>`;}
function render(){ $('#main').innerHTML=({home:renderHome,gather:renderGather,knowledge:renderKnowledge,mine:renderMine})[page]();document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-current',b.dataset.page===page?'page':'false'));document.title=`盲酌 · ${['首页','酒局','酒识','我的'][pages.indexOf(page)]} · 夜酌俱乐部 B`; }
function navigate(next,historyMode='push',focus=false){if(!pages.includes(next))return;if($('#sheet').open)closeSheet();page=next;render();try{const u=new URL(location.href);u.searchParams.set('page',page);history[historyMode==='push'?'pushState':'replaceState']({},'',u);}catch{}window.scrollTo({top:0,behavior:'instant'});if(focus)$('#main').focus({preventScroll:true});parent.postMessage({source:'mangzhuo-prototype',type:'page-change',page,version:'b'},location.origin==='null'?'*':location.origin);}
window.addEventListener('message',event=>{if(event.source!==parent)return;if(event.origin!==location.origin&&!(location.protocol==='file:'&&event.origin==='null'))return;const d=event.data;if(!d||d.source!=='mangzhuo-review'||d.type!=='navigate'||!pages.includes(d.page))return;navigate(d.page,'replace');});

function newNote(){openSheet('记一杯',`<div class="detail-meta">TASTING NOTE / 先写自己的感受</div><form id="note-form"><label class="field"><span>手记标题 <small style="display:inline">必填</small></span><input name="title" maxlength="60" required placeholder="为这一杯起个名字"></label><label class="field"><span>酒款名称 <small style="display:inline">可稍后补全</small></span><input name="wine" maxlength="80" placeholder="盲品时可以暂不填写"></label><label class="field"><span>香型</span><select name="aroma">${aromas.map(a=>`<option>${a}</option>`).join('')}</select></label><label class="field"><span>这一杯的感受 <small style="display:inline">必填</small></span><textarea name="feeling" maxlength="1200" required placeholder="闻到了什么？入口、回味又如何？"></textarea><small>先记感受，最后揭晓。用自己的词就好。</small></label><p class="small muted">仅保存于 B 版当前原型浏览器，不上传服务。</p><p id="note-error" class="form-error" role="alert"></p><button type="submit" class="cta"><span>保存手记</span><span aria-hidden="true">↗</span></button></form>`);}
function noteDetail(id){const n=allNotes().find(n=>n.id===id);if(!n)return;openSheet('品鉴手记',`<div class="detail-meta"><span>${n.demo?'演示手记':'本地手记'}</span><span>${esc(n.date)}</span><span>${esc(n.aroma)}</span></div><h3 class="serif">${esc(n.title)}</h3><p class="note-feeling">${esc(n.feeling)}</p><p class="small muted">酒款：${esc(n.wine)}</p>${n.demo?'<div class="notice">这是一篇演示手记，不是真实品饮记录。</div>':'<p class="small muted">仅保存在此原型浏览器。</p>'}${action('<span>用这篇制作酒卡</span><span aria-hidden="true">↗</span>','share','cta',`data-id="${esc(n.id)}"`)}`);}
function articleDetail(id){const a=[...articles,...extras].find(a=>a.id===id);if(!a)return;openSheet('杯中慢读',`<div class="detail-meta">${a.category} / 演示阅读</div><h3 class="serif">${esc(a.title)}</h3><article class="reading-body"><p class="lead">${esc(a.desc)}</p>${a.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}<div class="notice">${esc(a.tip)}</div><div class="source-note"><p>资料：${a.library?'miniprogram/data/liquor-knowledge.js':'miniprogram/utils/knowledge.js'}</p><p>仓库资料日期：2026.10.${a.library?'03':'02'}</p>${a.source?`<p>原文来源：${esc(a.source)}</p>`:''}<p>演示节选，未作最新标准核验。风味描述不作酒款鉴定结论。</p></div></article>${action('<span>去记下自己的感受</span><span aria-hidden="true">＋</span>','new-note','cta')}`);}
function shareCard(id){const n=allNotes().find(n=>n.id===id)||allNotes()[0];openSheet('制作分享酒卡',`<label class="field"><span>选择一篇手记</span><select id="share-select">${allNotes().map(x=>`<option value="${esc(x.id)}" ${x.id===n.id?'selected':''}>${esc(x.title)}${x.demo?' · 演示':''}</option>`).join('')}</select></label><div class="share-card"><div class="eyebrow">盲酌 / A NOTE TO REMEMBER</div><h3>${esc(n.title)}</h3><p>${esc(n.feeling)}</p><small>${esc(n.aroma)} · ${esc(n.date)}<br>${n.demo?'演示手记':'本地手记'} · 去掉酒标，只凭味道</small></div><p class="small muted">本原型提供酒卡预览与文字复制，不连接微信分享。</p>${action('复制酒卡文字','copy-share','cta',`data-id="${esc(n.id)}"`)}<p id="copy-status" class="copy-status" role="status"></p>`);}

function createRoom(){if(mode==='online'){openSheet('在线品鉴 · 待连接',`<h3 class="serif">等朋友入席，<br>先连接微信。</h3><div class="notice">演示原型未登录微信，未连接在线后台，无法发起真实房间。</div><p class="muted">你可以先体验本地示例局，了解编号、记录与揭晓流程。</p>${action('体验本地示例局','example-room','cta')}`);return;}openSheet('发起桌上酒局',`<div class="detail-meta">本地流程演练 / 不创建线上房间</div><form id="create-form"><label class="field"><span>酒局名称</span><input name="title" maxlength="40" required value="今晚的品鉴桌"></label><label class="field"><span>准备几款酒样？</span><select name="samples"><option value="2">2 款酒样</option><option value="3" selected>3 款酒样</option><option value="4">4 款酒样</option></select></label><div class="notice">本次为 4 人桌上演练，其他席位均为演示。记录保存在此浏览器，不邀请真实参与者。</div><p class="form-error" id="create-error" role="alert"></p><button type="submit" class="cta">摆好品鉴桌 ↗</button></form>`);}
function showRoom(){if(!room)return;const completed=Object.keys(room.records).filter(k=>room.records[k]?.trim()).length,done=completed>=room.samples;openSheet('桌上品鉴 · 本地演练',`<div class="detail-meta">${hint()}<span>${room.code==='2026'?'示例房间 2026':'无线上房间号'}</span><span>${room.samples} 款酒样 / 4 人（演示）</span></div><h3 class="serif">${esc(room.title)}</h3><p class="room-caption" style="margin-top:8px">席位 A · 你 / B、C、D · 演示席位<br>各自先写感受，完成后再揭晓。</p><div class="room-codes" aria-label="选择酒样">${Array.from({length:room.samples},(_,i)=>`<button type="button" class="${room.records[i]?'saved':''}" data-sample="${i}" aria-pressed="${i===selectedSample}">${String(i+1).padStart(2,'0')}</button>`).join('')}</div><p class="room-caption">已记录 ${completed} / ${room.samples} 杯 · ${room.records[selectedSample]?'本杯已保存，可继续修改':'本杯尚未保存'}</p><form id="room-record" style="margin-top:16px"><label class="field"><span>${String(selectedSample+1).padStart(2,'0')} 号酒样 · 第一印象</span><textarea name="feeling" maxlength="1200" required placeholder="先闻香，再写入口与回味">${esc(room.drafts?.[selectedSample]??room.records[selectedSample]??'')}</textarea></label><p class="form-error" id="room-error" role="alert"></p><button type="submit" class="cta">保存这杯感受 ↗</button></form><div class="reveal">${room.revealed?`<h3>揭晓 · 演示香型</h3>${Array.from({length:room.samples},(_,i)=>`<p>${String(i+1).padStart(2,'0')} / ${['酱香','清香','浓香','清香'][i]}（演示）</p>`).join('')}<p class="small muted">仅用于演练流程，不代表真实酒款。先前的感受已保留。</p>`:action(done?'揭晓本局酒样':'先完成每杯记录，再揭晓','reveal','outline',done?'':'disabled')}<p class="room-caption" style="margin-top:12px">仅存于 B 版原型浏览器，不向其他人同步。</p></div>`);}
function saveTable(){try{localStorage.setItem(TABLE_KEY,JSON.stringify(room));return true;}catch{return false;}}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;

 else if(a==='clear-search'){query='';$('#search').value='';$('#article-list').innerHTML=articleRows();$('#search').focus();}
 else if(a==='notes')openSheet('个人手记',`<p class="small muted" style="margin-bottom:16px">2 篇演示手记${notes.length?' + '+notes.length+' 篇本地手记':''} · 仅当前浏览器</p><div class="paper">${noteRows(allNotes())}</div>${action('记一杯','new-note','cta')}`);
 else if(a==='profile')openSheet('个人资料',`<div class="identity" style="margin-top:0"><div class="avatar" aria-hidden="true">酌</div><div><h3>品鉴者</h3><span class="tag amber">演示身份</span></div></div><div class="detail-list"><p>微信身份：未登录</p><p>个人数据：含示例数字与本地手记</p><p>保存范围：B 版当前原型浏览器</p></div><div class="notice">这是演示档案，不是已登录的微信账户。</div>`);
 else if(a==='about')openSheet('关于盲酌',`<div class="eyebrow amber">NIGHT TASTING CLUB / B</div><h3 class="serif" style="margin:16px 0">去掉酒标，只凭味道。</h3><p>一张晚间打开的私人品鉴桌。记酒款，记风味，也记相聚。</p><div class="notice">交互视觉原型 · 所有示例均为演示；未连接微信、在线房间或其他真实服务。</div><p class="small muted">清除浏览器数据会移除本地记录。仅供成年人，理性饮酒，量力而饮。</p>`);
 else if(a==='reveal'&&room&&Object.keys(room.records).length>=room.samples){room.revealed=true;if(!saveTable())showToast('揭晓可查看，但浏览器未允许保存');showRoom();}
 else if(a==='copy-share')copyShare(d.id,b);
});
document.addEventListener('change',e=>{if(e.target.id==='share-select')shareCard(e.target.value);});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('#article-list').innerHTML=articleRows();}});
document.addEventListener('submit',e=>{const f=e.target;if(!['note-form','join-form','create-form','search-form','room-record'].includes(f.id))return;e.preventDefault();const data=new FormData(f);
 if(f.id==='search-form'){query=String(data.get('query')||'');$('#article-list').innerHTML=articleRows();return;}
 if(f.id==='join-form'){if(String(data.get('code')).trim()!=='2026'){$('#join-error').textContent='仅可加入演示房间 2026，请核对编号。';return;}sampleRoom();return;}
 if(f.id==='note-form'){const title=String(data.get('title')||'').trim(),feeling=String(data.get('feeling')||'').trim();if(!title||!feeling){$('#note-error').textContent='请填写标题和感受，空白字符不算内容。';return;}const selected=String(data.get('aroma'));const n={id:'local-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),title:title.slice(0,60),feeling:feeling.slice(0,1200),wine:String(data.get('wine')||'').trim().slice(0,80)||'未填写酒款',aroma:aromas.includes(selected)?selected:'暂不判断',date:new Date().toLocaleDateString('zh-CN').replaceAll('/','.'),demo:false};const next=[n,...notes];try{localStorage.setItem(NOTE_KEY,JSON.stringify(next));}catch{$('#note-error').textContent='浏览器暂不允许保存，或存储空间不足。请保留内容并重试。';return;}notes=next;storageWarning='';f.querySelector('[type=submit]').disabled=true;closeSheet();render();showToast('手记已保存 · 仅当前原型浏览器');return;}
 if(f.id==='create-form'){const title=String(data.get('title')||'').trim();if(!title){$('#create-error').textContent='请为酒局起一个名字。';return;}const samples=Number(data.get('samples'));room={title:title.slice(0,40),samples:[2,3,4].includes(samples)?samples:3,people:4,code:'本地',demo:true,records:{},revealed:false};selectedSample=0;if(!saveTable()){$('#create-error').textContent='浏览器暂不允许保存，请重试。';return;}showRoom();return;}
 if(f.id==='room-record'&&room){const text=String(data.get('feeling')||'').trim();if(!text){$('#room-error').textContent='写下一点感受，再保存。';return;}const previous=room.records[selectedSample];room.records[selectedSample]=text.slice(0,1200);if(!saveTable()){if(previous===undefined)delete room.records[selectedSample];else room.records[selectedSample]=previous;$('#room-error').textContent='本地保存失败，请保留内容并重试。';return;}showRoom();showToast('这杯的感受已存于当前浏览器');}
});
async function copyShare(id,button){const n=allNotes().find(n=>n.id===id);if(!n)return;const text=`盲酌 · ${n.demo?'演示手记':'本地手记'}\n${n.title}\n${n.feeling}\n${n.aroma} · ${n.date}\n去掉酒标，只凭味道`;button.disabled=true;try{if(!navigator.clipboard?.writeText)throw Error('clipboard');await navigator.clipboard.writeText(text);$('#copy-status').textContent='酒卡文字已复制，可自行粘贴分享。';}catch{$('#copy-status').textContent='浏览器不支持自动复制，请长按或选择下方文字。';const t=document.createElement('textarea');t.readOnly=true;t.value=text;t.setAttribute('aria-label','可手动复制的酒卡文字');t.style.width='100%';$('#copy-status').append(t);t.focus();t.select();}finally{button.disabled=false;}}
navigate(pages.includes(new URLSearchParams(location.search).get('page'))?new URLSearchParams(location.search).get('page'):'home','replace');
</script>

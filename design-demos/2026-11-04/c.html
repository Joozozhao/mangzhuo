{id:'styles',category:'香型入门',title:'香型，是认识白酒的第一张地图',desc:'先认识酱香、浓香、清香，再建立自己的感官记忆。',paragraphs:['白酒产品标准按不同类别分别制定。香型可以帮助我们整理酒款，但不能单独说明一瓶酒的价格、品质或是否适合自己。','入门可以先挑选明确标注香型的酒款，分别建立酱香、浓香、清香的记录页。同一香型下也存在不同产品风格，不必寻找一个适用于所有酒款的唯一答案。','对比时先写自己的观察，揭晓后再补全瓶身信息。把“包装标注的香型”和“我闻到的香气”分别记录，日后复盘会更清晰。'],tip:'为最近一次打卡补上瓶身标注的香型。'},

category:b=>{category=b.dataset.category;render();$('#main').querySelector(`[data-category="${category}"]`).focus();},
'all-articles':()=>{category='全部';query='';render();},'clear-search':()=>{query='';$('#searchInput').value='';$('#articleResults').innerHTML=articleMarkup();$('#searchInput').focus();},'reset-search':()=>{query='';category='全部';render();$('#searchInput').focus();},
aroma:b=>{const a=aromas.find(a=>a.name===b.dataset.name);if(a)modal('酒识 · 风味线索',`<span class="demo">现有学习资料 / 演示阅读</span><h3>${a.name}</h3><p>${a.summary}</p><div class="detail-block"><p>${a.tip}</p></div><p class="muted">风味词是观察线索，不是酒款鉴定结论。产品信息以具体酒标为准。资料日期 2026.10.03，未做最新核验。</p><button class="solid" data-action="new-note">开始自己的观察 ↗</button>`);},
'my-aromas':()=>modal('我的香型记录',`<span class="demo">演示档案 / 2种香型</span><h3>酱香与清香，<br>各留了一页。</h3><p class="muted">这两种香型来自示例手记，非真实个人品鉴统计。</p>${seeds.map((n,i)=>`<button class="article-row" data-action="note" data-id="${n.id}"><span class="num">0${i+1}</span><span><strong>${n.aroma}</strong><small>${n.title} · 演示</small></span><span>↗</span></button>`).join('')}`),
profile:()=>modal('资料与偏好',`<span class="demo">演示身份 · 非微信资料</span><h3>品鉴者</h3><dl class="info-dl"><div><dt>显示名称</dt><dd>品鉴者</dd></div><div><dt>微信身份</dt><dd>未登录</dd></div><div><dt>记录习惯</dt><dd>先写感受，最后揭晓</dd></div><div><dt>保存范围</dt><dd>当前原型浏览器 / C版</dd></div></dl><p class="muted">原型仅展示资料结构，暂不提供微信登录或个人信息同步。</p><button class="outline" data-action="close">返回我的</button>`),
'storage-info':()=>modal('本地保存说明',`<h3>只在此处，留下一杯。</h3><p>新建手记和已保存的酒样观察，只写入 C 版专属的浏览器本地存储。没有真实账号或服务连接。</p><p>清除浏览器数据、换用其他设备或浏览器后，记录不会同步。示例手记始终带“演示”标记。</p><p class="muted">${storageOK?'当前浏览器可尝试保存本地记录。':'浏览器暂不允许持久保存，本次输入仅在当前页面保留。'}发起新的演示酒局会替换上一场本机演示酒局。</p><button class="outline" data-action="close">我知道了</button>`),
'copy-card':async()=>{const n=allNote($('#shareSelect').value);if(!n)return;const t=`盲酌 · ${n.demo?'演示酒卡':'本机手记'}\n${n.title}\n${n.feel}\n${n.aroma} / ${n.date}\n去掉酒标，只凭味道。理性饮酒。`;try{await navigator.clipboard.writeText(t);toast('酒卡文字已复制，未发送至微信。')}catch(_){const el=$('#copyFallback');if(!el)return;el.hidden=false;el.value=t;el.focus();el.select();toast('请长按或选择文字后复制。')}}
};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){navigate(b.dataset.page);$('#main').focus({preventScroll:true});return;}if(actions[b.dataset.action])actions[b.dataset.action](b);});
document.addEventListener('input',e=>{if(e.target.id==='searchInput'){query=e.target.value;$('#articleResults').innerHTML=articleMarkup();}});
document.addEventListener('change',e=>{if(e.target.id==='shareSelect'){renderCard(e.target.value);$('#copyFallback').hidden=true;}});
function showError(id,message,input){const el=$(id);el.hidden=false;el.textContent=message;if(input){input.setAttribute('aria-invalid','true');input.focus();}}
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target,fd=new FormData(form);
if(form.id==='noteForm'){const title=String(fd.get('title')).trim(),feel=String(fd.get('feel')).trim();if(!title||!feel)return showError('#noteError','请填写标题和这一杯的感受。',!title?$('#noteTitle'):$('#noteFeeling'));const d=new Date(),n={id:'new-'+Date.now(),title:title.slice(0,60),feel:feel.slice(0,2000),aroma:String(fd.get('aroma')),date:`${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`,tags:['本机记录'],demo:false};state.notes.unshift(n);state.notes=state.notes.slice(0,100);const saved=persist();render();showNote(n.id);toast(saved?'手记已保存在 C 版本地。':'本次页面已保留；浏览器未允许本地保存。');}
if(form.id==='joinForm'){const code=String(fd.get('code')).trim();if(mode==='online')return offline();if(code==='2026')sampleRoom();else if(code==='6026'&&state.room){activeRoom=state.room;sampleIndex=0;revealed=false;renderRoom();}else showError('#joinError','原型仅提供示例号 2026；未连接真实房间。',$('#roomCode'));}
if(form.id==='roomForm'){const name=String(fd.get('name')).trim();if(!name)return showError('#roomError','请为演示酒局填写名称。',$('#roomName'));state.room={name:name.slice(0,40),count:Number(fd.get('count')),people:Number(fd.get('people')),code:'6026',notes:{}};const saved=persist();activeRoom=state.room;sampleIndex=0;revealed=false;render();renderRoom();toast(saved?'演示酒局已保留在本机。':'演示酒局仅在本次页面保留。');}
if(form.id==='sessionForm'){const feeling=String(fd.get('feel')).trim();if(!feeling)return showError('#sessionError','先写下一点感受，再保存。',$('#sessionFeeling'));activeRoom.notes[sampleIndex]=feeling.slice(0,1000);if(activeRoom.isSample)state.sampleNotes=activeRoom.notes;else state.room=activeRoom;const saved=persist();toast(saved?'这杯的观察已保存在本机。':'观察仅在本次页面保留。');}
});
const initial=new URLSearchParams(location.search).get('page');navigate(Object.hasOwn(pages,initial)?initial:'home',false);
</script>
</body>
</html>
